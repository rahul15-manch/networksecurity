# Nginx Reverse Proxy Configuration for PhishGuard Backend
# File destination: /etc/nginx/sites-available/phishguard
# Enable with: sudo ln -s /etc/nginx/sites-available/phishguard /etc/nginx/sites-enabled/

# Rate Limiting Zone: 10 requests per second per client IP with a burst of 20
limit_req_zone $binary_remote_addr zone=phishguard_limit:10m rate=10r/s;

upstream phishguard_upstream {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.phishguard.yourdomain.com your-ec2-domain-or-ip;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.phishguard.yourdomain.com your-ec2-domain-or-ip;

    # SSL Certificate Paths (Managed via Certbot Let's Encrypt or Custom CA)
    ssl_certificate /etc/letsencrypt/live/api.phishguard.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.phishguard.yourdomain.com/privkey.pem;

    # Modern TLS Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Client Request Body Bounds (Prevent payload exhaustion)
    client_max_body_size 2M;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Gzip Compression for JSON responses
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json text/plain text/css application/javascript;

    # Root location (Direct API routing)
    location / {
        limit_req zone=phishguard_limit burst=20 nodelay;

        proxy_pass http://phishguard_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Location /api/ (Supports CloudFront /api/ routing behavior)
    location /api/ {
        limit_req zone=phishguard_limit burst=20 nodelay;

        # Strips the /api/ prefix and passes the rest to FastAPI upstream
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://phishguard_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Health Check (Fast bypass without rate limiting for ELB/CloudWatch probes)
    location = /health {
        proxy_pass http://phishguard_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
