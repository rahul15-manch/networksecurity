AWSTemplateFormatVersion: '2010-09-09'
Description: >
  PhishGuard AWS Infrastructure: Secure S3 Bucket + CloudFront OAC for Frontend,
  EC2 Security Group, and IAM Instance Profile in ap-south-1 (Mumbai).

Parameters:
  ProjectName:
    Type: String
    Default: phishguard
    Description: Base name for tagging and resource naming convention.

  Environment:
    Type: String
    Default: production
    AllowedValues:
      - production
      - staging
    Description: Deployment environment tier.

Resources:
  # ----------------------------------------------------------------------------
  # 1. Private Frontend S3 Bucket (No Public Access)
  # ----------------------------------------------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-frontend-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-frontend-bucket"
        - Key: Environment
          Value: !Ref Environment

  # ----------------------------------------------------------------------------
  # 2. CloudFront Origin Access Control (OAC)
  # ----------------------------------------------------------------------------
  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-s3-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ----------------------------------------------------------------------------
  # 3. CloudFront CDN Distribution
  # ----------------------------------------------------------------------------
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${ProjectName} Production Frontend CDN"
        Enabled: true
        HttpVersion: http2and3
        DefaultRootObject: index.html
        Origins:
          - Id: S3FrontendOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          # Managed-CachingOptimized Cache Policy ID
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-cdn"
        - Key: Environment
          Value: !Ref Environment

  # ----------------------------------------------------------------------------
  # 4. S3 Bucket Policy (Enforces CloudFront OAC Access Only)
  # ----------------------------------------------------------------------------
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  # ----------------------------------------------------------------------------
  # 5. EC2 Security Group for Backend API
  # ----------------------------------------------------------------------------
  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "Restrictive Security Group for ${ProjectName} Backend"
      GroupName: !Sub "${ProjectName}-backend-sg"
      SecurityGroupIngress:
        # Inbound HTTPS from web
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: "Inbound public HTTPS"
        # Inbound HTTP (for Let's Encrypt renewal and redirection)
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: "Inbound HTTP for ACME challenge & HTTPS redirect"
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: "Outbound access for DNS, packages, and threat validation"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-backend-sg"
        - Key: Environment
          Value: !Ref Environment

  # ----------------------------------------------------------------------------
  # 6. EC2 IAM Role for SSM Management (No open SSH ports required!)
  # ----------------------------------------------------------------------------
  BackendEC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-ec2-backend-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-ec2-role"

  BackendInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${ProjectName}-ec2-instance-profile"
      Roles:
        - !Ref BackendEC2Role

Outputs:
  FrontendBucketName:
    Description: Private S3 Bucket for Frontend Assets
    Value: !Ref FrontendBucket

  CloudFrontDomainName:
    Description: CloudFront Distribution Domain URL
    Value: !GetAtt CloudFrontDistribution.DomainName

  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref CloudFrontDistribution

  BackendSecurityGroupId:
    Description: EC2 Security Group ID
    Value: !GetAtt BackendSecurityGroup.GroupId

  BackendInstanceProfileName:
    Description: IAM Instance Profile Name for EC2
    Value: !Ref BackendInstanceProfile
