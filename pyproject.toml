[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "networksecurity"
version = "1.1.0"
description = "PhishGuard AI-Powered Phishing Detection Platform"
readme = "README.md"
requires-python = ">=3.10, <=3.12"
dependencies = [
    "python-dotenv==1.2.4",
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "scikit-learn==1.7.2",
    "scipy==1.15.3",
    "pandas==2.3.3",
    "numpy==2.2.6",
    "dill==0.4.1",
]
